    <script>

        // ================= GLOBAL =================
        let SCALE_MAX = 30;
        let WIDTH_WRF, HEIGHT_WRF;
        let WIDTH_GPM, HEIGHT_GPM;
        const BBOX = [87.32, 19.35, 99.03, 30.66];
        let direction = 1; // +1 forward, -1 reverse
        let currentRequestId = 0;
        let BLUR_MODE = "linear";
        let GAUSS_RADIUS = 1; // 1 = 3x3 kernel

        let USE_MAX_FILTER = false;
        let USE_NEIGH_MAX = false;

        let framesLeft = {};
        let framesRight = {};

        let SPLIT = 0.5;
        const contourCache = {};


        //====boot======
        async function boot() {

            await loadMeta();

            // load both datasets
            await loadDataset();

            preloadContours();

            // use WRF as default for left map
            frames = framesLeft;

            // set correct grid size (WRF)
            WIDTH = meta_wrf.nx;
            HEIGHT = meta_wrf.ny;

            loaded = true;

            updateTimeLabel(1);

            document.getElementById("loader").style.display = "none";

            console.log("✅ All datasets ready");
        }

        boot();

        function resizeMapToBBox() {

            const bboxWidth =
                BBOX[2] - BBOX[0];

            const bboxHeight =
                BBOX[3] - BBOX[1];

            const aspect =
                bboxWidth / bboxHeight;

            const winW = window.innerWidth;
            const winH = window.innerHeight;

            let w = winW;
            let h = w / aspect;

            if (h > winH) {

                h = winH;
                w = h * aspect;
            }

            const wrapper =
                document.getElementById("mapWrapper");

            wrapper.style.width =
                `${w}px`;

            wrapper.style.height =
                `${h}px`;

            map.resize();
        }

        async function loadDataset() {

            const base = "/data/bin/";

            const promises = [];

            for (let i = 1; i <= 72; i++) {

                promises.push(

                    fetch(`${base}rain_${String(i).padStart(3, '0')}.bin`)
                        .then(r => r.arrayBuffer())
                        .then(buf => {

                            framesLeft[i] =
                                new Float32Array(buf);

                            console.log(`✅ WRF frame ${i}`);
                        })
                );
            }

            await Promise.all(promises);

            console.log("✅ WRF dataset loaded");
        }

        function setFrame(newFrame) {

            frame = newFrame;

            if (frame > 72) frame = 1;
            if (frame < 1) frame = 72;

            timeline.value = frame;

            document.getElementById("frameLabel").textContent =
                `Frame: ${frame}`;

            updateTimeLabel(frame);

            loadContours(frame);

            map.triggerRepaint();
        }

        async function loadContours(frame) {

            // already cached
            if (contourCache[frame]) {

                if (map.getSource('gpm-contours')) {
                    map.getSource('gpm-contours')
                        .setData(contourCache[frame]);
                }

                return;
            }

            const url =
                `/contours/contour_${String(frame).padStart(3, '0')}.geojson`;

            const res = await fetch(url);

            const data = await res.json();

            // store in RAM
            contourCache[frame] = data;

            if (map.getSource('gpm-contours')) {

                map.getSource('gpm-contours')
                    .setData(data);

            } else {

                map.addSource('gpm-contours', {
                    type: 'geojson',
                    data
                });

                map.addLayer({

                    id: 'gpm-contours-line',
                    type: 'line',
                    source: 'gpm-contours',

                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },

                    paint: {

                        'line-color': [
                            'interpolate',
                            ['linear'],
                            ['get', 'value'],

                            1, '#00e5ff',
                            5, '#00ff00',
                            10, '#ffff00',
                            20, '#ff9900',
                            50, '#ff0000',
                            100, '#ff00ff'
                        ],

                        'line-width': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],

                            5, [
                                'interpolate',
                                ['linear'],
                                ['get', 'value'],

                                1, 2,
                                5, 3,
                                10, 4,
                                20, 5,
                                50, 7,
                                100, 9
                            ],

                            9, [
                                'interpolate',
                                ['linear'],
                                ['get', 'value'],

                                1, 3,
                                5, 5,
                                10, 6,
                                20, 8,
                                50, 10,
                                100, 14
                            ]
                        ],

                        'line-opacity': 0.95,
                        'line-blur': 0.3
                    }
                });
            }
        }

        async function preloadContours() {

            for (let i = 1; i <= 72; i++) {

                const url =
                    `/contours/contour_${String(i).padStart(3, '0')}.geojson`;

                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        contourCache[i] = data;
                        console.log(`✅ Cached contour ${i}`);
                    });
            }
        }

        function toRGBA(data, width, height) {

            const rgba = new Uint8Array(width * height * 4);

            for (let i = 0; i < data.length; i++) {

                let d = data[i];

                // 🚫 mask invalid / no rain
                if (!isFinite(d) || d <= 0) {
                    rgba[i * 4 + 3] = 0; // transparent
                    continue;
                }

                // normalize
                let v = d / SCALE_MAX;
                v = Math.min(1, Math.max(0, v));

                rgba[i * 4 + 0] = v * 255;  // only R channel
                rgba[i * 4 + 1] = 0;
                rgba[i * 4 + 2] = 0;
                rgba[i * 4 + 3] = 255;
            }

            return rgba;
        }

        function createSplitLayer() {
            return {
                id: 'rain-split',
                type: 'custom',
                renderingMode: '2d',

                onAdd: function (map, gl) {

                    const vs = `
                    attribute vec2 a_pos;
                    uniform mat4 u_matrix;
                    uniform vec2 u_min;
                    uniform vec2 u_max;
                    varying vec2 v_uv;

                    void main() {
                        v_uv = (a_pos - u_min) / (u_max - u_min);
                        gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0);
                    }`;

                    const fs = `
                    precision highp float;

                    uniform sampler2D u_wrf;

                    varying vec2 v_uv;

                    vec3 colorMap(float t) {
                        if (t < 0.15) return mix(vec3(0.0), vec3(0.0,0.2,1.0), t/0.15);
                        else if (t < 0.3) return mix(vec3(0.0,0.2,1.0), vec3(0.0,1.0,1.0), (t-0.15)/0.15);
                        else if (t < 0.5) return mix(vec3(0.0,1.0,1.0), vec3(0.0,1.0,0.0), (t-0.3)/0.2);
                        else if (t < 0.7) return mix(vec3(0.0,1.0,0.0), vec3(1.0,1.0,0.0), (t-0.5)/0.2);
                        else return mix(vec3(1.0,1.0,0.0), vec3(1.0,0.0,0.0), (t-0.7)/0.3);
                    }

                    void main() {
                        float t;

                        vec2 uv = v_uv;
                        t = texture2D(u_wrf, uv).r;

                        vec3 color = colorMap(t);
                        float alpha = smoothstep(0.01, 0.2, t);

                        gl_FragColor = vec4(color, alpha);
                    }`;

                    function compile(type, src) {
                        const s = gl.createShader(type);
                        gl.shaderSource(s, src);
                        gl.compileShader(s);
                        return s;
                    }

                    const program = gl.createProgram();
                    gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
                    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
                    gl.linkProgram(program);
                    this.a_pos = gl.getAttribLocation(program, "a_pos");
                    this.program = program;

                    this.texWRF = gl.createTexture();
                    // this.texGPM = gl.createTexture();

                    this.u_matrix = gl.getUniformLocation(program, "u_matrix");
                    // this.u_split = gl.getUniformLocation(program, "u_split");
                    this.u_wrf = gl.getUniformLocation(program, "u_wrf");
                    // this.u_gpm = gl.getUniformLocation(program, "u_gpm");

                    const [minLon, minLat, maxLon, maxLat] = BBOX;

                    this.u_min = gl.getUniformLocation(program, "u_min");
                    this.u_max = gl.getUniformLocation(program, "u_max");



                    const pBL = maplibregl.MercatorCoordinate.fromLngLat([minLon, minLat]);
                    const pBR = maplibregl.MercatorCoordinate.fromLngLat([maxLon, minLat]);
                    const pTL = maplibregl.MercatorCoordinate.fromLngLat([minLon, maxLat]);
                    const pTR = maplibregl.MercatorCoordinate.fromLngLat([maxLon, maxLat]);

                    this.min = [pBL.x, pBL.y];
                    this.max = [pTR.x, pTR.y];

                    const vertices = new Float32Array([

                        pBL.x, pBL.y,
                        pBR.x, pBR.y,
                        pTL.x, pTL.y,

                        pTL.x, pTL.y,
                        pBR.x, pBR.y,
                        pTR.x, pTR.y
                    ]);

                    this.buffer = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
                    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

                    console.log("🔥 Split layer added");
                },

                render: function (gl, matrix) {


                    if (!loaded) return;

                    const wrf = framesLeft[frame];
                    // const gpm = framesRight[frame];

                    // if (!wrf || !gpm) return;

                    let wrfData = wrf;

                    if (BLUR_MODE === "gaussian") {
                        wrfData = gaussianBlur2D(wrfData, WIDTH_WRF, HEIGHT_WRF, GAUSS_RADIUS);
                    }

                    if (USE_NEIGH_MAX) {
                        wrfData = neighborhoodMax3x3(wrfData, WIDTH_WRF, HEIGHT_WRF);
                    }

                    if (USE_MAX_FILTER) {
                        wrfData = maxFilter2D(wrfData, WIDTH_WRF, HEIGHT_WRF, 1);

                    }

                    if (
                        this.cacheFrame !== frame ||
                        this.cacheScale !== SCALE_MAX
                    ) {

                        this.texWRFData =
                            toRGBA(wrfData, WIDTH_WRF, HEIGHT_WRF);

                        this.cacheFrame = frame;
                        this.cacheScale = SCALE_MAX;
                    }

                    // WRF
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, this.texWRF);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, WIDTH_WRF, HEIGHT_WRF, 0, gl.RGBA, gl.UNSIGNED_BYTE, this.texWRFData);

                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                    gl.useProgram(this.program);

                    gl.uniformMatrix4fv(this.u_matrix, false, matrix);
                    // gl.uniform1f(this.u_split, SPLIT);

                    gl.uniform1i(this.u_wrf, 0);

                    gl.uniform2fv(this.u_min, this.min);
                    gl.uniform2fv(this.u_max, this.max);

                    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
                    gl.enableVertexAttribArray(this.a_pos);
                    gl.vertexAttribPointer(this.a_pos, 2, gl.FLOAT, false, 0, 0);

                    gl.drawArrays(gl.TRIANGLES, 0, 6);

                    console.log("🎯 Rendering frame");
                }
            };
        }

        let meta_GPM;
        let meta_wrf;

        let LAT_ARR, LON_ARR;

        async function loadMeta() {
            const res_left = await fetch(`/data/bin/meta.json`);
            meta_wrf = await res_left.json();

            LAT_ARR_wrf = meta_wrf.lat;
            LON_ARR_wrf = meta_wrf.lon;

            WIDTH_WRF = meta_wrf.nx;
            HEIGHT_WRF = meta_wrf.ny;

            console.log("WRF LAT size:", LAT_ARR_wrf?.length, "x", LON_ARR_wrf?.length);

        }


        //Sync Function

        function syncMaps(mapA, mapB) {
            let isSyncing = false;

            function sync(source, target) {
                if (isSyncing) return;

                isSyncing = true;

                const center = source.getCenter();
                const zoom = source.getZoom();
                const bearing = source.getBearing();
                const pitch = source.getPitch();

                target.easeTo({
                    center,
                    zoom,
                    bearing,
                    pitch,
                    duration: 0   // keep 0 for no lag
                });

                isSyncing = false;
            }

            mapA.on('move', () => sync(mapA, mapB));
            mapB.on('move', () => sync(mapB, mapA));
        }

        //==================timestamploading==========

        function updateTimeLabel(frame) {
            const ts = meta_wrf.timestamps[frame - 1];
            const date = new Date(ts);

            document.getElementById("timeLabel").textContent = date.toUTCString();
        }
        // ================= LEGEND =================
        const scaleSlider = document.getElementById("scaleSlider");

        scaleSlider.oninput = () => {
            SCALE_MAX = parseFloat(scaleSlider.value);
            updateLegendLabels();
        };

        function updateLegendLabels() {
            const labels = document.querySelectorAll("#legendLabels span");
            const values = [0, SCALE_MAX * 0.25, SCALE_MAX * 0.5, SCALE_MAX * 0.75, SCALE_MAX];
            labels.forEach((el, i) =>
                el.textContent = values[i].toFixed(1)
            );
        }

        function drawLegend() {
            const canvas = document.getElementById("legendCanvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 256;
            canvas.height = 20;

            const grad = ctx.createLinearGradient(0, 0, 256, 0);
            grad.addColorStop(0.0, "black");
            grad.addColorStop(0.2, "blue");
            grad.addColorStop(0.35, "cyan");
            grad.addColorStop(0.5, "lime");
            grad.addColorStop(0.7, "yellow");
            grad.addColorStop(0.85, "orange");
            grad.addColorStop(1.0, "red");

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 20);
        }

        updateLegendLabels();
        drawLegend();

        // ================= DATA =================

        let loaded = false;

        //===============BLURMode=================

        blurStrength.oninput = () => {
            GAUSS_RADIUS = parseInt(blurStrength.value);
        };

        maxFilter.onchange = () => {
            USE_MAX_FILTER = maxFilter.checked;
        };

        neighMax.onchange = () => {
            USE_NEIGH_MAX = neighMax.checked;
        };

        blurMode.onchange = () => {
            BLUR_MODE = blurMode.value;
        };

        function maxFilter2D(data, width, height, radius = 1) {

            const output = new Float32Array(data.length);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {

                    let maxVal = 0;

                    for (let ky = -radius; ky <= radius; ky++) {
                        for (let kx = -radius; kx <= radius; kx++) {

                            const xx = Math.min(width - 1, Math.max(0, x + kx));
                            const yy = Math.min(height - 1, Math.max(0, y + ky));

                            const val = data[yy * width + xx];
                            if (val > maxVal) maxVal = val;
                        }
                    }

                    output[y * width + x] = maxVal;
                }
            }

            return output;
        }

        function neighborhoodMax3x3(data, width, height) {

            const output = new Float32Array(data.length);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {

                    let maxVal = data[y * width + x];

                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {

                            const xx = Math.min(width - 1, Math.max(0, x + kx));
                            const yy = Math.min(height - 1, Math.max(0, y + ky));

                            const val = data[yy * width + xx];
                            if (val > maxVal) maxVal = val;
                        }
                    }

                    output[y * width + x] = maxVal;
                }
            }

            return output;
        }

        function gaussianBlur2D(data, width, height, radius = 1) {

            const kernelSize = radius * 2 + 1;
            const sigma = radius / 2;

            const kernel = [];
            let sum = 0;

            for (let i = -radius; i <= radius; i++) {
                const val = Math.exp(-(i * i) / (2 * sigma * sigma));
                kernel.push(val);
                sum += val;
            }

            // normalize
            for (let i = 0; i < kernel.length; i++) {
                kernel[i] /= sum;
            }

            const temp = new Float32Array(data.length);
            const output = new Float32Array(data.length);

            // horizontal pass
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {

                    let acc = 0;

                    for (let k = -radius; k <= radius; k++) {
                        const xx = Math.min(width - 1, Math.max(0, x + k));
                        acc += data[y * width + xx] * kernel[k + radius];
                    }

                    temp[y * width + x] = acc;
                }
            }

            // vertical pass
            for (let x = 0; x < width; x++) {
                for (let y = 0; y < height; y++) {

                    let acc = 0;

                    for (let k = -radius; k <= radius; k++) {
                        const yy = Math.min(height - 1, Math.max(0, y + k));
                        acc += temp[yy * width + x] * kernel[k + radius];
                    }

                    output[y * width + x] = acc;
                }
            }

            return output;
        }

        //============SEARCH===================
        searchBtn.onclick = async () => {

            const query = searchInput.value.trim();
            if (!query) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

            const res = await fetch(url);
            const data = await res.json();

            if (!data.length) {
                alert("Location not found");
                return;
            }

            const place = data[0];

            const lon = parseFloat(place.lon);
            const lat = parseFloat(place.lat);

            // fly to location
            map.flyTo({
                center: [lon, lat],
                zoom: 8
            });
            map.fire('click', {
                lngLat: { lng: lon, lat: lat }
            });

            // optional marker
            new maplibregl.Marker({ color: "yellow" })
                .setLngLat([lon, lat])
                .addTo(map);

        };

        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                searchBtn.click();
            }
        });

        let debounceTimer;

        searchInput.addEventListener("input", () => {

            const query = searchInput.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 3) {
                suggestions.style.display = "none";
                return;
            }

            debounceTimer = setTimeout(async () => {

                const requestId = ++currentRequestId;

                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

                const res = await fetch(url);
                const data = await res.json();

                // 👉 ignore old responses
                if (requestId !== currentRequestId) return;

                renderSuggestions(data);

            }, 300);
        });

        function renderSuggestions(list) {

            suggestions.innerHTML = "";

            if (!list.length) {
                suggestions.style.display = "none";
                return;
            }

            suggestions.style.display = "block";

            list.slice(0, 5).forEach(place => {

                const div = document.createElement("div");

                div.textContent = place.display_name;
                div.style.padding = "6px";
                div.style.cursor = "pointer";
                div.style.borderBottom = "1px solid #eee";

                div.onmouseenter = () => div.style.background = "#f2f2f2";
                div.onmouseleave = () => div.style.background = "#ffffff";

                div.onclick = () => {

                    const lon = parseFloat(place.lon);
                    const lat = parseFloat(place.lat);

                    map.flyTo({
                        center: [lon, lat],
                        zoom: 8
                    });

                    map.fire('click', {
                        lngLat: { lng: lon, lat: lat }
                    });

                    suggestions.style.display = "none";
                    searchInput.value = place.display_name;
                };

                suggestions.appendChild(div);
            });
        }

            // trigger existing logic (VERY IMPORTANT)

        let playing = true;
        // let speed = 100;
        let frame = 1;

        playPause.onclick = () => {
            playing = !playing;
            playPause.textContent = playing ? "⏸ Pause" : "▶ Play";
        };

        let fps = 5;

        speed.onchange = () => {

        };

        };



        // STEP FORWARD
        stepForward.onclick = () => {

        };

        // STEP BACK
        stepBack.onclick = () => {
            playing = false;
            setFrame(frame + 1);
        };

        // REVERSE PLAY
        reverse.onclick = () => {
            playing = true;
            direction = -1;
            playPause.textContent = "⏸ Reverse";
        };

        playPause.onclick = () => {
            playing = !playing;
            direction = 1;
            playPause.textContent = playing ? "⏸ Pause" : "▶ Play";
        };
        let lastFrameTime = 0;
        let lastContourFrame = -1;

        function animate(now) {

            requestAnimationFrame(animate);

            if (!playing || !loaded) return;

            const interval = 1000 / fps;

            if (now - lastFrameTime < interval) return;

            lastFrameTime = now;

            setFrame(frame + direction);
        }

        requestAnimationFrame(animate);

        function findNearestIndex(arr, val) {
            if (!arr || arr.length === 0) {
                console.error("Array not ready:", arr);
                return 0;
            }

            let minDiff = Infinity;
            let idx = 0;

            for (let i = 0; i < arr.length; i++) {
                const diff = Math.abs(arr[i] - val);
                if (diff < minDiff) {
                    minDiff = diff;
                    idx = i;
                }
            }
            return idx;
        }


        //===============Verify-Panel===================

        openVerify.onclick = () => {

        let verifyChart;
        function drawVerifyChart(hourly, timestamps) {

            if (verifyChart) verifyChart.destroy();

            verifyChart = new Chart(ctx, {
                type: 'line',

                        {
                            // label: `${DATASET.toUpperCase()} Rain`,
                            data: hourly,
                            borderColor: '#00e5ff',
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        legend: { labels: { color: '#ccc' } }
                    },
                    scales: {
                        x: { ticks: { color: '#aaa' } },
                        y: { ticks: { color: '#aaa' } }

            });
        }

        let meteogramChart;
        function drawMeteogram(hourly, timestamps) {

            const ctx = document.getElementById("meteogram").getContext("2d");

            // cumulative
            let cum = 0;
            const cumulative = hourly.map(v => cum += v);

            const labels = timestamps.map(t => {
                const d = new Date(t);
                return d.getUTCHours() + ":00";
            });

            if (meteogramChart) meteogramChart.destroy();

            meteogramChart = new Chart(ctx, {
                data: {
                    labels,
                    datasets: [

                        // 🌧️ Rain bars
                        {
                            type: 'bar',
                            label: 'Rain (mm/hr)',
                            data: hourly,

                            backgroundColor: hourly.map((v, i) => {

                                if (i === frame - 1) return '#ff2d2d';

                                if (v > 50) return '#ff0000';
                                if (v > 20) return '#ff7f00';
                                if (v > 10) return '#ffd700';
                                if (v > 2) return '#00e5ff';
                                return '#1e3a8a';
                            }),

                            borderWidth: hourly.map((_, i) => i === frame - 1 ? 2 : 0),
                            borderColor: '#ffffff',

                            barPercentage: 0.7,
                            categoryPercentage: 0.9,
                            borderRadius: 2,
                            yAxisID: 'y'
                        },

                        // 📈 cumulative line
                        {
                            type: 'line',
                            label: 'Cumulative (mm)',
                            data: cumulative,
                            borderColor: '#00ffcc',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(0,255,200,0.08)',
                            pointRadius: 0,
                            yAxisID: 'y1'
                        }
                    ]
                },

                options: {
                    responsive: true,
                    animation: false,

                    plugins: {
                        legend: {
                            labels: { color: '#ccc' }
                        },

                        title: {
                            display: true,
                            text: 'Rainfall Meteogram',
                            color: '#fff'
                        },

                        tooltip: {
                            backgroundColor: '#111',
                            borderColor: '#444',
                            borderWidth: 1,
                            callbacks: {
                                label: (ctx) => `${ctx.raw.toFixed(2)} mm/hr`
                            }
                        }
                    },

                    scales: {
                        x: {
                            ticks: {
                                color: '#aaa',
                                maxTicksLimit: 8
                            },
                            grid: {
                                color: 'rgba(255,255,255,0.05)'
                            }
                        },

                        y: {
                            position: 'left',
                            title: {
                                display: true,
                                text: 'mm/hr',
                                color: '#aaa'
                            },
                            ticks: { color: '#aaa' },
                            grid: {
                                color: 'rgba(255,255,255,0.05)'
                            }
                        },

                        y1: {
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#aaa' }
                        }
                    }
                }
            });
        }



        // ================= LAYER =================
        map.on('load', () => {


            map.addSource('terrain', {
                type: 'raster-dem',
                tiles: [
                    'https://api.maptiler.com/tiles/terrain-rgb-v2/{z}/{x}/{y}.png?key=rXxNYojI5TunEnE0Clu1'
                ],

                    'hillshade-exaggeration': 0.4
                }
            });


            resizeMapToBBox();

            map.fitBounds(
                [
                    [BBOX[0], BBOX[1]],
                    [BBOX[2], BBOX[3]]
                ],
                {
                    padding: 10,
                    duration: 0
                }
            );
            map.addLayer(createSplitLayer());
        });

        map.on('mousemove', (e) => {
            if (!isDragging) return;

            const w = map.getCanvas().width;
            SPLIT = e.point.x / w;
            line.style.left = `${e.point.x}px`;
        });

        let activeMarker = null;

        map.on('click', (e) => {

            if (!loaded) return;

            const lon = e.lngLat.lng;
            const lat = e.lngLat.lat;

            const [minLon, minLat, maxLon, maxLat] = BBOX;

            if (lon < minLon || lon > maxLon || lat < minLat || lat > maxLat) return;

            const xi_wrf = findNearestIndex(LON_ARR_wrf, lon);
            const yi_wrf = findNearestIndex(LAT_ARR_wrf, lat);

            const index_wrf = yi_wrf * WIDTH_WRF + xi_wrf;

            // extract rainfall series
            const hourly = [];

            for (let t = 1; t <= 72; t++) {

                let dataLeft = framesLeft[t];

                if (BLUR_MODE === "gaussian") {
                    dataLeft = gaussianBlur2D(dataLeft, WIDTH_WRF, HEIGHT_WRF, GAUSS_RADIUS);
                }

                if (USE_NEIGH_MAX) {
                    dataLeft = neighborhoodMax3x3(dataLeft, WIDTH_WRF, HEIGHT_WRF);
                }

                if (USE_MAX_FILTER) {
                    dataLeft = maxFilter2D(dataLeft, WIDTH_WRF, HEIGHT_WRF, 1);
                }


                hourly.push(dataLeft[index_wrf]);
            }

            // remove previous marker
            if (activeMarker) {
                activeMarker.remove();
            }

            // create new marker
            activeMarker = new maplibregl.Marker({ color: "#00ffff" }) // optional styling
                .setLngLat([lon, lat])
                .addTo(map);

            console.log("Sample values:", hourly.slice(0, 10));
            console.log("Max:", Math.max(...hourly));

            drawMeteogram(hourly, meta_wrf.timestamps);
            document.getElementById("meteogramPanel").style.display = "block";
            console.log("Meteogram max:", Math.max(...hourly));
        });

        let isDragging = false;

        map.on('mousedown', () => isDragging = true);
        map.on('mouseup', () => isDragging = false);

        const line = document.createElement('div');
        line.style.position = 'absolute';

        line.style.bottom = '0';
        line.style.width = '2px';
        line.style.background = 'white';
        line.style.pointerEvents = 'none';
        document.body.appendChild(line);

        window.addEventListener(
            'resize',
            resizeMapToBBox
        );


    </script>
