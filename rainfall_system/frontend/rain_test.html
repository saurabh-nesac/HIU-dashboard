<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Rain Map (WebGL)</title>

<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<style>
body { margin: 0; }
#map { width: 100vw; height: 100vh; }

#controls {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-family: sans-serif;
    z-index: 9999;
}

#legend {
    position: absolute;
    right: 20px;
    bottom: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 8px;
    color: white;
    font-family: sans-serif;
    z-index: 9999;
}

#legendCanvas {
    width: 200px;
    height: 15px;
    display: block;
}

#legendLabels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="legend">
    <label>Max Rain:</label>
    <input type="range" id="scaleSlider" min="10" max="80" value="80">
    <canvas id="legendCanvas"></canvas>
    <div id="legendLabels">
        <span>0</span>
        <span>5</span>
        <span>10</span>
        <span>20</span>
        <span>50+</span>
    </div>
</div>

<div id="controls">
    <button id="playPause">⏸ Pause</button>
    <label>Speed:</label>
    <select id="speed">
        <option value="200">0.5x</option>
        <option value="100" selected>1x</option>
        <option value="50">2x</option>
    </select>
    <input type="range" id="timeline" min="1" max="72" value="1" />
    <span id="frameLabel">Frame: 1</span>
</div>

<script>

// ================= GLOBAL =================
let SCALE_MAX = 20;
const WIDTH = 396;
const HEIGHT = 423;
const BBOX = [87.32, 19.35, 99.03, 30.66];

// ================= LEGEND =================
const scaleSlider = document.getElementById("scaleSlider");

scaleSlider.oninput = () => {
    SCALE_MAX = parseFloat(scaleSlider.value);
    updateLegendLabels();
};

function updateLegendLabels() {
    const labels = document.querySelectorAll("#legendLabels span");
    const values = [0, SCALE_MAX*0.25, SCALE_MAX*0.5, SCALE_MAX*0.75, SCALE_MAX];
    labels.forEach((el, i) => el.textContent = Math.round(values[i]));
}

function drawLegend() {
    const canvas = document.getElementById("legendCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 256;
    canvas.height = 20;

    const grad = ctx.createLinearGradient(0, 0, 256, 0);
    grad.addColorStop(0.0, "black");
    grad.addColorStop(0.2, "blue");
    grad.addColorStop(0.35, "cyan");
    grad.addColorStop(0.5, "lime");
    grad.addColorStop(0.7, "yellow");
    grad.addColorStop(0.85, "orange");
    grad.addColorStop(1.0, "red");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 20);
}

updateLegendLabels();
drawLegend();

// ================= DATA =================
let frames = {};
let loaded = false;

async function preloadFrames() {
    for (let i = 1; i <= 72; i++) {
        const res = await fetch(`/data/bin/rain_${String(i).padStart(3,'0')}.bin`);
        const buf = await res.arrayBuffer();
        frames[i] = new Float32Array(buf);
    }
    loaded = true;
    console.log("Frames loaded");
}
preloadFrames();

// ================= MAP =================
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://api.maptiler.com/maps/outdoor-v2-dark/style.json?key=rXxNYojI5TunEnE0Clu1',
    center: [92, 26],
    zoom: 6
});

// ================= CONTROLS =================
let playing = true;
let speed = 100;
let frame = 1;

playPause.onclick = () => {
    playing = !playing;
    playPause.textContent = playing ? "⏸ Pause" : "▶ Play";
};

speed.onchange = () => speed = parseInt(speed.value);
timeline.oninput = () => frame = parseInt(timeline.value);

// ================= LAYER =================
map.on('load', () => {

    map.addSource('terrain', {
        type: 'raster-dem',
        url: 'https://api.maptiler.com/tiles/terrain-rgb/tiles.json?key=rXxNYojI5TunEnE0Clu1',
        tileSize: 256
    });

    map.setTerrain({ source: 'terrain', exaggeration: 1.5 });

    const customLayer = {

        id: 'rain-layer',
        type: 'custom',
        renderingMode: '2d',

        onAdd: function (map, gl) {

            gl.getExtension('EXT_color_buffer_float');
            gl.getExtension('OES_texture_float_linear');
            gl.getExtension('OES_texture_float');
            const vs = `
            attribute vec2 a_pos;

            uniform mat4 u_matrix;
            uniform vec2 u_min;
            uniform vec2 u_max;

            varying vec2 v_uv;

            void main() {
                v_uv = (a_pos - u_min) / (u_max - u_min);
                gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0);
            }`;

            const fs = `
            precision highp float;

            uniform sampler2D u_rain;

            varying vec2 v_uv;

            void main() {

                float rain = texture2D(u_rain, v_uv).r;

                // 🔥 DO NOT divide again
                rain *= 2.5;

                float t = pow(smoothstep(0.0, 1.0, rain), 0.6);

                vec3 c0 = vec3(0.0);
                vec3 c1 = vec3(0.0, 0.2, 1.0);
                vec3 c2 = vec3(0.0, 1.0, 1.0);
                vec3 c3 = vec3(0.0, 1.0, 0.0);
                vec3 c4 = vec3(1.0, 1.0, 0.0);
                vec3 c5 = vec3(1.0, 0.5, 0.0);
                vec3 c6 = vec3(1.0, 0.0, 0.0);

                vec3 color;

                if (t < 0.2)
                    color = mix(c0, c1, t / 0.2);
                else if (t < 0.35)
                    color = mix(c1, c2, (t - 0.2) / 0.15);
                else if (t < 0.5)
                    color = mix(c2, c3, (t - 0.35) / 0.15);
                else if (t < 0.7)
                    color = mix(c3, c4, (t - 0.5) / 0.2);
                else if (t < 0.85)
                    color = mix(c4, c5, (t - 0.7) / 0.15);
                else
                    color = mix(c5, c6, (t - 0.85) / 0.15);

                float alpha = smoothstep(0.01, 0.2, rain);

                gl_FragColor = vec4(color, alpha);
                // gl_FragColor = vec4(1.0, 0.0, 0.0, 0.5);
                // gl_FragColor = vec4(v_uv, 0.0, 1.0);
            }`;

            function compile(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                return s;
            }

            const program = gl.createProgram();
            gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
            gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(program);

            this.program = program;

            this.texture = gl.createTexture();

            this.a_pos = gl.getAttribLocation(program, "a_pos");
            this.u_matrix = gl.getUniformLocation(program, "u_matrix");
            this.u_rain = gl.getUniformLocation(program, "u_rain");
            this.u_min = gl.getUniformLocation(program, "u_min");
            this.u_max = gl.getUniformLocation(program, "u_max");
            // this.u_scale = gl.getUniformLocation(program, "u_scale");

            const [minLon, minLat, maxLon, maxLat] = BBOX;

            const p1 = maplibregl.MercatorCoordinate.fromLngLat([minLon, minLat]);
            const p2 = maplibregl.MercatorCoordinate.fromLngLat([maxLon, minLat]);
            const p3 = maplibregl.MercatorCoordinate.fromLngLat([minLon, maxLat]);
            const p4 = maplibregl.MercatorCoordinate.fromLngLat([maxLon, maxLat]);

            const vertices = new Float32Array([
                p1.x, p1.y,
                p2.x, p2.y,
                p3.x, p3.y,
                p3.x, p3.y,
                p2.x, p2.y,
                p4.x, p4.y
            ]);

            this.buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            // this.min = [p1.x, p1.y];
            // this.max = [p4.x, p4.y];
            this.min = [Math.min(p1.x, p3.x), Math.min(p1.y, p2.y)];
            this.max = [Math.max(p2.x, p4.x), Math.max(p3.y, p4.y)];
        },

        render: function (gl, matrix) {

            if (!loaded) return;

            const data = frames[frame];

            const rgba = new Uint8Array(data.length * 4);

            for (let i = 0; i < data.length; i++) {
                let v = data[i] / SCALE_MAX;
                v = Math.min(1, Math.max(0, v));
                const val = v * 255;

                rgba[i*4+0] = val;
                rgba[i*4+1] = val;
                rgba[i*4+2] = val;
                rgba[i*4+3] = 255;
            }


            // gl.bindTexture(gl.TEXTURE_2D, this.texture);
            gl.bindTexture(gl.TEXTURE_2D, this.texture);

            gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA,
                WIDTH,
                HEIGHT,
                0,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                rgba
            );

            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            gl.useProgram(this.program);

            gl.uniformMatrix4fv(this.u_matrix, false, matrix);
            gl.uniform2fv(this.u_min, this.min);
            gl.uniform2fv(this.u_max, this.max);
            // gl.uniform1f(this.u_scale, SCALE_MAX);

            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.enableVertexAttribArray(this.a_pos);
            gl.vertexAttribPointer(this.a_pos, 2, gl.FLOAT, false, 0, 0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.texture);
            gl.uniform1i(this.u_rain, 0);

            gl.drawArrays(gl.TRIANGLES, 0, 6);

            if (playing) {
                const now = performance.now();
                if (!this.lastTime) this.lastTime = now;

                if (now - this.lastTime > speed) {
                    frame = (frame % 72) + 1;
                    this.lastTime = now;
                }
            }

            timeline.value = frame;
            frameLabel.textContent = "Frame: " + frame;

            map.triggerRepaint();
        }
    };

    map.addLayer(customLayer);
});
</script>

</body>
</html>
