<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Rain Map (WebGL)</title>

<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }

    #controls {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        
        background: rgba(0,0,0,0.7);
        color: white;
        
        padding: 10px 15px;
        border-radius: 8px;
        
        display: flex;
        gap: 10px;
        align-items: center;

        font-family: sans-serif;

        z-index: 9999;   /* 🔥 THIS FIXES IT */
    }
    #controls input[type="range"] {
        width: 200px;
    }
</style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <button id="playPause">⏸ Pause</button>

    <label>Speed:</label>
    <select id="speed">
        <option value="200">0.5x</option>
        <option value="100" selected>1x</option>
        <option value="50">2x</option>
    </select>

    <input type="range" id="timeline" min="1" max="72" value="1" />

    <span id="frameLabel">Frame: 1</span>
</div>

<script>
// ======================================================
// CONFIG
// ======================================================

const WIDTH = 396;
const HEIGHT = 423;
const BBOX = [87.32, 19.35, 99.03, 30.66];

// ======================================================
// DATA CONVERSION
// ======================================================

function toRGBA8(data) {
    const out = new Uint8Array(data.length * 4);

    for (let i = 0; i < data.length; i++) {
        let v = data[i] * 5.0; // 🔥 boost visibility
        v = Math.min(1.0, Math.max(0.0, v));

        const val = v * 255;

        out[i*4+0] = val;
        out[i*4+1] = val;
        out[i*4+2] = val;
        out[i*4+3] = 255;
    }
    return out;
}

// ======================================================
// PRELOAD FRAMES (CRITICAL FIX)
// ======================================================

let frames = {};
let loaded = false;

async function preloadFrames() {
    console.log("Loading frames...");

    for (let i = 1; i <= 72; i++) {
        const res = await fetch(`/data/bin/rain_${String(i).padStart(3,'0')}.bin`);
        const buf = await res.arrayBuffer();
        frames[i] = new Float32Array(buf);
    }

    loaded = true;
    console.log("All frames loaded");
}

preloadFrames();

// ======================================================
// MAP INIT
// ======================================================

// const map = new maplibregl.Map({
//     container: 'map',
//     style: 'https://demotiles.maplibre.org/style.json',
//     center: [92, 26],
//     zoom: 5
// });

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://api.maptiler.com/maps/outdoor-v2/style.json?key=rXxNYojI5TunEnE0Clu1',
    center: [92, 26],
    zoom: 5
});

// ======================================================
// CUSTOM LAYER
// ======================================================
let playing = true;
let speed = 100; // ms per frame

const playBtn = document.getElementById("playPause");
const speedSel = document.getElementById("speed");
const timeline = document.getElementById("timeline");
const label = document.getElementById("frameLabel");

// Play / Pause
playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? "⏸ Pause" : "▶ Play";
};

// Speed
speedSel.onchange = () => {
    speed = parseInt(speedSel.value);
};

// Slider
timeline.oninput = () => {
    frame = parseInt(timeline.value);
};

let frame = 1;

map.on('load', () => {

    map.addSource('terrain', {
        type: 'raster-dem',
        url: 'https://api.maptiler.com/tiles/terrain-rgb/tiles.json?key=YOUR_API_KEY',
        tileSize: 256
    });

    map.setTerrain({
        source: 'terrain',
        exaggeration: 1.5
    });
    const customLayer = {
        id: 'rain-layer',
        type: 'custom',
        renderingMode: '2d',

        onAdd: function (map, gl) {

            // ===== SHADERS =====

            const vs = `#version 300 es
            uniform mat4 u_matrix;
            uniform vec2 u_min;
            uniform vec2 u_max;

            in vec2 a_pos;
            out vec2 v_uv;

            void main() {
                v_uv = (a_pos - u_min) / (u_max - u_min);
                gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0);
            }`;

            const fs = `#version 300 es
            precision highp float;

            uniform sampler2D u_rain;
            in vec2 v_uv;
            out vec4 outColor;

            void main() {

                float rain = texture(u_rain, v_uv).r;

                float norm = sqrt(rain);

                vec3 color;

                if (norm < 0.1) color = vec3(0.0);
                else if (norm < 0.3) color = vec3(0.0, 0.5*norm, 1.0);
                else if (norm < 0.6) color = vec3(0.0, 1.0, norm);
                else color = vec3(1.0, norm, 0.0);

                float alpha = smoothstep(0.02, 0.2, rain);

                outColor = vec4(color, alpha);
            }`;

            function compile(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);

                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                    console.error(gl.getShaderInfoLog(s));
                }

                return s;
            }

            const program = gl.createProgram();
            gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
            gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(program);

            this.program = program;

            // ===== GEO QUAD =====

            const [minLon, minLat, maxLon, maxLat] = BBOX;

            const p1 = maplibregl.MercatorCoordinate.fromLngLat([minLon, minLat]);
            const p2 = maplibregl.MercatorCoordinate.fromLngLat([maxLon, minLat]);
            const p3 = maplibregl.MercatorCoordinate.fromLngLat([minLon, maxLat]);
            const p4 = maplibregl.MercatorCoordinate.fromLngLat([maxLon, maxLat]);

            const vertices = new Float32Array([
                p1.x, p1.y,
                p2.x, p2.y,
                p3.x, p3.y,

                p3.x, p3.y,
                p2.x, p2.y,
                p4.x, p4.y
            ]);

            this.buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            this.a_pos = gl.getAttribLocation(program, "a_pos");
            this.u_matrix = gl.getUniformLocation(program, "u_matrix");
            this.u_rain = gl.getUniformLocation(program, "u_rain");
            this.u_min = gl.getUniformLocation(program, "u_min");
            this.u_max = gl.getUniformLocation(program, "u_max");

            const min = maplibregl.MercatorCoordinate.fromLngLat([minLon, minLat]);
            const max = maplibregl.MercatorCoordinate.fromLngLat([maxLon, maxLat]);

            this.min = [min.x, min.y];
            this.max = [max.x, max.y];
        },

        render: function (gl, matrix) {

            if (!loaded) return;

            const data = frames[frame];
            const rgba = toRGBA8(data);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);

            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

            gl.texImage2D(
                gl.TEXTURE_2D,
                0,
                gl.RGBA,
                WIDTH,
                HEIGHT,
                0,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                rgba
            );

            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

            gl.useProgram(this.program);

            gl.uniformMatrix4fv(this.u_matrix, false, matrix);
            gl.uniform2fv(this.u_min, this.min);
            gl.uniform2fv(this.u_max, this.max);

            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.enableVertexAttribArray(this.a_pos);
            gl.vertexAttribPointer(this.a_pos, 2, gl.FLOAT, false, 0, 0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.uniform1i(this.u_rain, 0);

            gl.drawArrays(gl.TRIANGLES, 0, 6);

            // frame++;
            // if (frame > 72) frame = 1;
            if (playing) {
                const now = performance.now();

                if (!this.lastTime) {
                    this.lastTime = now;
                }

                if (now - this.lastTime >= speed) {
                    frame++;
                    if (frame > 72) frame = 1;

                    this.lastTime = now;
                }
            }

            map.triggerRepaint();

            timeline.value = frame;
            label.textContent = "Frame: " + frame;
        }
    };

    map.addLayer(customLayer);
});
</script>

</body>
</html>
